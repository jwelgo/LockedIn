version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: workout-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - .db/init:/docker-entrypoint-initdb.d
    networks:
      - workout-tracker-net
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workout-tracker-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - workout-tracker-net
    expose:
      - "8080"

    reverse-proxy:
      image: nginx:1.27-alpine
      container_name: workout-tracker-proxy
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - ./reverse-proxy/certs:/etc/nginx/certs:ro
      depends_on:
        - backend
      networks:
        - workout-tracker-net

networks:
  workout-tracker-net:
    driver: bridge

volumes:
  db-data: